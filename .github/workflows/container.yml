name: CI/CD ACR pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ------------------------------------------------------
      # TRIVY: Filesystem scan (dependencies, libraries, OS)
      # ------------------------------------------------------
      - name: Trivy FS scan (repo)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ------------------------------------------------------
      # TRIVY: IaC (Helm / K8s / Terraform)
      # ------------------------------------------------------
      - name: Trivy Config scan (IaC misconfigurations)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy Config SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # ------------------------------------------------------
      # SonarCloud
      # ------------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=gurramsatish1_python-cicd-github-actions
            -Dsonar.organization=gurramsatish1
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io/

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login (Azure)
        uses: docker/login-action@v3
        with:
          registry: gaptraiing.azurecr.io
          username: ${{ vars.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build Docker image
        run: |
          docker build -t gaptraiing.azurecr.io/python-cicd:${{ github.sha }} .

      # ------------------------------------------------------
      # TRIVY: Docker Image Scan
      # ------------------------------------------------------
      - name: Trivy Image scan (ACR image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: gaptraiing.azurecr.io/python-cicd:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # ------------------------------------------------------
      # PUSH IMAGE TO ACR
      # ------------------------------------------------------
      - name: Push Docker image (only if trivy passed)
        if: success()
        run: |
          docker push gaptraiing.azurecr.io/python-cicd:${{ github.sha }}

      # ------------------------------------------------------
      # UPDATE HELM VALUES FILE
      # ------------------------------------------------------
      - name: Update helm-chart/values.yaml with new image tag
        if: success()
        run: |
          set -euo pipefail

          VALUES_FILE="helm-chart/values.yaml"
          IMAGE_REPO="gaptraiing.azurecr.io/python-cicd"
          IMAGE_TAG="${{ github.sha }}"

          echo "Updating ${VALUES_FILE} with ${IMAGE_REPO}:${IMAGE_TAG}"

          YQ_VERSION="v4.44.3"
          BINARY="yq_linux_amd64"
          curl -sL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${BINARY}.tar.gz" \
            | tar xz && sudo mv ${BINARY} /usr/local/bin/yq

          yq -i '
            .image = (.image // {}) |
            .image.repository = "'"${IMAGE_REPO}"'" |
            .image.tag = "'"${IMAGE_TAG}"'"
          ' "$VALUES_FILE"

          echo "Updated $VALUES_FILE:"
          cat "$VALUES_FILE"

      # ------------------------------------------------------
      # COMMIT & PUSH UPDATED VALUES FILE
      # ------------------------------------------------------
      - name: Commit and push values.yaml update
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code; then
            echo "No changes to commit."
            exit 0
          fi

          git add helm-chart/values.yaml
          git commit -m "chore: update Helm image to gaptraiing.azurecr.io/python-cicd:${GITHUB_SHA}"
          git push origin main
